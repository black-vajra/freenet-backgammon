[package]
name = "backgammon-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
backgammon-contract = { path = "../backgammon-contract", default-features = false }
backgammon-core = { path = "../backgammon-core" }
backgammon-lobby-core = { path = "../backgammon-lobby-core" }
backgammon-protocol = { path = "../backgammon-protocol" }
ciborium.workspace = true
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
serde.workspace = true
freenet-stdlib = { version = "0.8.5", features = ["net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "HtmlInputElement", "Storage", "WebSocket", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }
