[package]
name = "backgammon-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
backgammon-core = { path = "../backgammon-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
freenet-stdlib = { version = "0.8.5", features = ["net"] }
web-sys = { version = "0.3", features = ["Crypto", "WebSocket", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }
