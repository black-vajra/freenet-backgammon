[workspace]
resolver = "2"
members = [
    "crates/backgammon-core",
    "crates/backgammon-protocol",
    "crates/backgammon-contract",
    "crates/backgammon-lobby-contract",
    "crates/backgammon-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ciborium = "0.2.2"
freenet-scaffold = "0.2.2"
freenet-scaffold-macro = "0.2.2"
freenet-stdlib = { version = "0.8.5", features = ["contract"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
